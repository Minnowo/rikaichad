[package]
name = "jisho-format"
description = "Parsing and validation of Yomitan dictionary zips (index, banks, structured content), with caps for hostile input."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the Deflated variant of CompressionMethod is used from this feature;
# entries are inflated by flate2 directly so a bad CRC can be a warning.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
jisho-testkit = { path = "../jisho-testkit" }
