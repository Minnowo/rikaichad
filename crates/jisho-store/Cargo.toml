[package]
name = "jisho-store"
description = "Single-file SQLite store for imported dictionaries: streaming import and lookup queries."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
jisho-format = { path = "../jisho-format" }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
jisho-testkit = { path = "../jisho-testkit" }

[lints]
workspace = true
