[package]
name = "jisho-api"
description = "HTTP/JSON API server for jisho lookups and dictionary management."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
jisho-format = { path = "../jisho-format" }
jisho-store = { path = "../jisho-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["net", "rt-multi-thread", "time", "signal"] }

[dev-dependencies]
jisho-testkit = { path = "../jisho-testkit" }
serde_json = "1"

[lints]
workspace = true
