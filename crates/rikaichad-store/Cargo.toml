[package]
name = "rikaichad-store"
description = "Single-file SQLite store for imported dictionaries: streaming import and lookup queries."
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rikaichad-format = { path = "../rikaichad-format" }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks"] }
serde_json = "1"
# Glossaries are stored compressed with a dictionary trained per imported
# dictionary (docs/plan/milestone-3.md, storage).
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }

[dev-dependencies]
rikaichad-testkit = { path = "../rikaichad-testkit" }

[lints]
workspace = true
