[workspace]
resolver = "3"
members = [
    "crates/rikaichad-format",
    "crates/rikaichad-ja",
    "crates/rikaichad-store",
    "crates/rikaichad-lookup",
    "crates/rikaichad-api",
    "crates/rikaichad",
    "crates/rikaichad-testkit",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
