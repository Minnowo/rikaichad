# SPDX-License-Identifier: AGPL-3.0-or-later
# Build, lint and test on Linux, macOS and Windows; check that a store file
# written on Linux works unchanged on the other two (brief section 6,
# milestone 1); compare lookups on the public corpus with Yomitan's.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Full check script (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/check.sh
      - name: Build, lint and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # Yomitan parity on the public corpus (docs/plan/milestone-3.md).
  corpus-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch the public corpus
        run: scripts/fetch-corpus.sh
      - name: Compare with Yomitan's results
        run: cargo test --release -p rikaichad-lookup --test corpus_parity --locked -- --ignored --exact public_corpus_matches_golden

  portable-store-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Write a store
        env:
          RIKAICHAD_PORTABLE_STORE: ${{ runner.temp }}/portable.sqlite
        run: cargo test -p rikaichad --test portable_store --locked -- --ignored --exact write_portable_store
      - uses: actions/upload-artifact@v4
        with:
          name: portable-store
          path: ${{ runner.temp }}/portable.sqlite
          if-no-files-found: error

  portable-store-read:
    needs: portable-store-write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/download-artifact@v4
        with:
          name: portable-store
          path: ${{ runner.temp }}/store
      - name: Read the Linux store
        shell: bash
        env:
          RIKAICHAD_PORTABLE_STORE: ${{ runner.temp }}/store/portable.sqlite
        run: cargo test -p rikaichad --test portable_store --locked -- --ignored --exact read_portable_store
