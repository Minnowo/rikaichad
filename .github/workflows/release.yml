# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds jisho for Linux, macOS and Windows and publishes a GitHub release
# when a version tag (v0.1.0, ...) is pushed. The tag must match the
# workspace version in Cargo.toml. Each archive holds the binary, LICENSE,
# NOTICE, README.md and THIRD-PARTY-LICENSES.txt (docs/install.md,
# "Distributing binaries"); GitHub adds the source archives the AGPL asks
# for. Run it by hand (workflow_dispatch) to build and test without
# publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 for an older glibc (2.35), so the binary runs on more
          # distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on the Apple silicon runner; not run there.
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF line endings on Windows: test fixtures and the embedded UI
      # are compared and served byte for byte.
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Test
        if: matrix.test
        shell: bash
        run: cargo test --workspace --locked
      - name: Build
        shell: bash
        env:
          # Shown by GET /v1/source (AGPL-3.0 section 13).
          JISHO_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: cargo build --release --locked -p jisho --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          name="jisho-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then exe=jisho.exe; py=python; else exe=jisho; py=python3; fi
          cp "target/${{ matrix.target }}/release/$exe" LICENSE NOTICE README.md "dist/$name/"
          "$py" -I scripts/third-party-licenses.py > "dist/$name/THIRD-PARTY-LICENSES.txt"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test the binary
        if: matrix.test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=jisho.exe; else exe=jisho; fi
          "target/${{ matrix.target }}/release/$exe" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "jisho ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease
